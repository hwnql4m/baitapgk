<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="css/style.css">
    <title>Login</title>
</head>
<body>
    <div class = "auth">
        <div class = "Login">
            <h1>Đăng nhập</h1>
            <form action="index.html" method="GET">
                <div class ="Nhap">
                    <label for="Username">Email hoặc tên người dùng</label>
                    <input type="text" placeholder="Nhập email hoặc tên người dùng" required>
                </div>
                <div class = "Nhap">
                    <label for="Password">
                        Nhập mật khẩu
                    </label>
                    <input type="password" placeholder="Nhập mật khẩu" required>
                </div>
                <button type ="submit" class="btn_submit">Đăng nhập</button>
            </form>
            <p class ="dangki">
                Chưa có tài khoản? <a href="register.html">Đăng ký</a>
            </p>
        </div>
    </div>
</body>
</html>
