<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="css/style.css">
    <title>Login</title>
</head>
<body>
    <div class = "auth">
        <div class = "Reg">
            <h1>Đăng nhập</h1>
            <form action="index.html" method="GET">
                <div class ="Nhap">
                    <label for="Name">Họ và tên</label>
                    <input type="text" placeholder="Nhập họ và tên" required>
                </div>
                <div class ="Nhap">
                    <label for="Username">Tên người dùng</label>
                    <input type="text" placeholder="Nhập Tên người dùng" required>
                </div>
                <div class ="Nhap">
                    <label for="Email">Email</label>
                    <input type="email" placeholder="Nhập Email" required>
                </div>
                <div class = "Nhap">
                    <label for="Password">
                        Nhập mật khẩu
                    </label>
                    <input type="password" placeholder="Nhập mật khẩu" required minlength = "6">
                </div>
                <div class = "Nhap">
                    <label for="Password">
                        Xác nhận mật khẩu
                    </label>
                    <input type="password" placeholder="Nhập mật khẩu" required minlength = "6">
                </div>
                <button type ="submit" class="btn_submit">Đăng ký</button>
            </form>
            <p class ="dangnhap">
                Đã tài khoản? <a href="login.html">Đăng nhập</a>
            </p>
        </div>
    </div>
</body>
</html>
